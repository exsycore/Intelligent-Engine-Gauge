; ESP32-2432S028 (Cheap Yellow Display) - Smart Gauge
; 2.8" ILI9341 320x240 TFT + XPT2046 resistive touch, landscape orientation.
;
; Display bus: HSPI (TFT_eSPI)
;   MOSI 13, MISO 12, SCLK 14, CS 15, DC 2, RST -1, BL 21
; Touch bus:  VSPI (XPT2046, separate controller)
;   MOSI 32, MISO 39, SCLK 25, CS 33, IRQ 36

[env:jczn_2432s028r]
platform = espressif32
board = jczn_2432s028r
framework = arduino
monitor_speed = 115200

lib_deps =
  bodmer/TFT_eSPI@^2.5.43

build_flags =
  -DUSER_SETUP_LOADED=1
  -DILI9341_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_GFXFF=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  -DCORE_DEBUG_LEVEL=0
